name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 这个权限必须加，才能推送镜像到 GHCR

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

     # 1. 登录到 GHCR
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}  # 直接用 GitHub 自动生成的 Token，无需额外配置

  # 2. 构建并推送镜像
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true  # 关键：设置为 true 才会推送
        tags: |
          ghcr.io/${{ github.repository_owner }}/mallservice-python:latest
          ghcr.io/${{ github.repository_owner }}/mallservice-python:${{ github.sha }}
